services:
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-halo}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-halo}
    volumes:
      - ./backend/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "1883:1883"    # MQTT (ESP32)
      - "5672:5672"    # AMQP (backend)
      - "15672:15672"  # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 5

  # Local stand-in for Tiger Data. In prod, point DATABASE_URL at Tiger Cloud and drop this service.
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: halo
      POSTGRES_PASSWORD: halo
      POSTGRES_DB: halo
    volumes:
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
      - tsdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      timescaledb:
        condition: service_started
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  tsdata:
